# Deploys to Fly.io. It runs only when started by hand from the Actions tab, never on a push
# or a merge, so nothing goes live that the owner did not send. It needs the repository
# secret FLY_API_TOKEN, which the owner creates (see docs/DEPLOY.md).
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fly's own setup action, as its documentation shows it.
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --build-arg GIT_COMMIT=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
