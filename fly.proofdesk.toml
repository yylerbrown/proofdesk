# Fly.io configuration for the real site, the app `proofdesk`, with GitHub sign-in (the demo
# is fly.toml). Deploy it by hand with: fly deploy --config fly.proofdesk.toml (see
# docs/DEPLOY.md). The Deploy workflow deploys only the demo.

app = "proofdesk"
# Where the disk and the machine are. Fly no longer offers "sea".
primary_region = "sjc"
# On a deploy or a stop, Fly sends this signal, then kills the process after the timeout. The
# server finishes requests in flight within 8 seconds (src/server/serve.ts), so it exits first.
kill_signal = "SIGTERM"
kill_timeout = 10

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATABASE_PATH = "/data/app.db"
  # Where Fly's proxy puts the visitor's address. Used for rate limits. See docs/DEPLOY.md:
  # this must be checked on the first deploy.
  CLIENT_IP_HEADER = "fly-client-ip"
  # The public copy of the source, linked from the sign-in page (/sign-in) as "Source and setup".
  SOURCE_URL = "https://github.com/yylerbrown/proofdesk"
  # The demo, linked from this site's sign-in page so a visitor can try it without signing in.
  DEMO_URL = "https://support-desk-demo.fly.dev"
  # No DEMO: this is the real site. Its GitHub sign-in settings are Fly secrets, set by the
  # owner (see docs/DEPLOY.md); the server refuses to start in production without them.

# The disk that holds the database. Create it once with: fly volumes create support_desk_data
[[mounts]]
  source = "support_desk_data"
  destination = "/data"

# One machine, always on: SQLite lives on its disk, so there is exactly one copy.
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
